name: merge-queue
on:
  merge_group:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - run: echo "This DCO job runs on merge_queue event and does not do anything"
  semantic:
    name: Semantic PR
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - run: echo "This DCO job runs on merge_queue event and does not do anything"
